# Fly.io config (https://fly.io/docs/reference/configuration/). Run `fly launch --no-deploy`
# from this folder, then `fly volumes create nearabouts_data --size 1`, then `fly deploy`.
app = "nearabouts"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DATABASE_PATH = "/data/nearabouts.sqlite"
  TRUST_PROXY = "true"
  IMAGERY_PROVIDER = "demo"

[[mounts]]
  source = "nearabouts_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Multiplayer rooms live in memory on one machine: keep exactly one running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
